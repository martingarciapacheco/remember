name: Release installers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both validated installers as a GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: juce-framework/JUCE
          ref: 29396c22c93392d6738e021b83196283d6e4d850
          path: out/tools/JUCE
          persist-credentials: false
      - name: Validate and package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/ReleasePipelineTests.ps1
          $lock = Get-Content installer/dependencies.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory out/tools/pluginval | Out-Null
          Invoke-WebRequest $lock.pluginval.url -OutFile out/tools/pluginval.zip -MaximumRetryCount 4 -RetryIntervalSec 5
          if ((Get-FileHash out/tools/pluginval.zip).Hash -ine $lock.pluginval.archiveSha256) { throw 'pluginval checksum mismatch' }
          Expand-Archive out/tools/pluginval.zip out/tools/pluginval
          $tools = ./installer/get-packaging-tools.ps1 -OutputDirectory out/tools/packaging
          ./installer/build-release.ps1 -JucePath out/tools/JUCE -PluginvalPath out/tools/pluginval/pluginval.exe -Generator 'Visual Studio 17 2022' -BuildRoot out/ci-release -IsccPath $tools.iscc -UnpackerPath $tools.unpacker
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: windows-installers
          path: |
            out/ci-release/artifacts/
            out/ci-release/logs/
          if-no-files-found: error
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: juce-framework/JUCE
          ref: 29396c22c93392d6738e021b83196283d6e4d850
          path: out/tools/JUCE
          persist-credentials: false
      - name: Download pinned macOS validator
        run: |
          mkdir -p out/tools/pluginval
          curl --fail --location --retry 3 https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o out/tools/pluginval/macOS.zip
      - name: Validate and package universal macOS app and VST3
        run: python3 installer/build-macos.py --juce out/tools/JUCE --pluginval-archive out/tools/pluginval/macOS.zip
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: macos-installers
          path: |
            out/macos-release/artifacts/
            out/macos-release/*-tests.xml
            out/macos-release/pluginval.log
            out/macos-release/*/Testing/Temporary/
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-installers'
          path: out/installers
      - name: Publish only the complete pair from this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 installer/publish-pair.py out/installers
